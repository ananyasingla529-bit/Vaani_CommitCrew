services:
  - type: web
    name: vaani-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MOCK_MODE
        value: "false"
      - key: ENABLE_BACKGROUND_WORKER
        value: "true"
      - key: TELEGRAM_LIVE
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TELEGRAM_MODERATOR_CHAT_ID
        sync: false
